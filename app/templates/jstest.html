function botRandomAction()
{
    var active_button = document.getElementById("opp-active-button");
    if(active_button)
    {
        var active_card = all_cards[parseInt(active_button.value)];
        
        if(active_card)
        {
            if(active_card["current_hp"] < active_card["max_hp"] / 2)
            {
                var num_cards = 0;    
                
                if( Math.random() * 4 < 2 || active_card["current_hp"] == 0)
                {
                var rand_swap = Math.floor((Math.random() * 4) + 5);
                while(all_cards[rand_swap]["current_hp"] <= 0)
                {
                    rand_swap = Math.floor((Math.random() * 4) + 5);
                    num_cards++;
                    if(num_cards > 4){break;}
                }
                if(num_cards > 4)
                {
                    oppAddAttack();
                }
                else
                    {action_list.push(new action(rand_swap, rand_swap, -3, all_cards[rand_swap]["spd"]));}
                }
                else
                {
                    oppAddAttack();
                }
            }
            else
            {
                oppAddAttack();
            }
        }
    }
}

function swapReserveActive()
{
    if(reserves_1 == 0){return -1;}

    // console.log(res_card);

    var active_img = document.getElementById("active-card");

    current_action.innerHTML = `${active_card["name"]} has fainted. ${res_card["name"]} swapped in.`;   
    active_button.value = res_card["game_id"];
    active_img.src = `https://senioritis.dev/static/cards/${res_card["card_id"]}.png`;
    active_hp.innerHTML = `HP: ${res_card["current_hp"]}`;
    reserves_1--;
    your_cards_alive++;
    return 0;
}

function updateStats()
{
    your_cards_alive = 0;
    opp_cards_alive = 0;
    for(let i = 0; i < 4; i++)
    {
        var this_button = document.getElementById(`${i}-button`);
        var this_hp = document.getElementById(`${i}-hp`);
        if(this_hp)
        {
            if(all_cards[this_button.value]["current_hp"] > 0)
            {
                your_cards_alive++;
            }
            else
            {
                swapReserveId(i);
            }
            this_hp.innerHTML = `HP: ${all_cards[this_button.value]["current_hp"]}`;
        }
    }
    for(let i = 5; i < 9; i++)
    {
        var this_button = document.getElementById(`opp-${i}-button`);
        var this_hp = document.getElementById(`opp-${i}-hp`);
        if(this_hp)
        {
            // console.log(all_cards[this_button.value]);
            if(all_cards[this_button.value]["current_hp"] > 0)
            {
                opp_cards_alive++;
            }
            else
            {
                console.log(`${i} dead`);
                swapBotReserveId(i);
            }
            this_hp.innerHTML = `HP: ${all_cards[this_button.value]["current_hp"]}`;
        }
    }
    var active_button = document.getElementById("active-button");
    var active_hp = document.getElementById("active-hp");
    if(active_hp)
    {
        if(all_cards[active_button.value]["current_hp"] > 0)

        }
        else
        {
            var res_swapped = swapReserveActive();
            
        }

        }

{

}

function oppAddAttack()
{
    var active_button = document.getElementById("active-button");
    var active_card = all_cards[parseInt(active_button.value)];
    
    var opp_button = document.getElementById("opp-active-button");
    var opp_card = all_cards[parseInt(opp_button.value)];
    
    if(opp_card["atk"] != "-1")
    {
    
        var total_atk = parseInt(opp_card["atk"]) + opp_card["buffs"];
        
        var total_def = parseInt(active_card["def"]) + active_card["buffs"];
        
        var dmg_dealt = total_atk - total_def;
        if(dmg_dealt < 1){dmg_dealt = 1;}
    
        action_list.push(new action(parseInt(opp_button.value), parseInt(active_button.value), dmg_dealt, parseInt(opp_card["spd"])));
    }
    else
    {
        
        if(buffers_arr.includes(opp_card["card_id"]))
        {
            var num_cards = 0;
            var rand_swap = Math.floor((Math.random() * 4) + 5);
                while(all_cards[rand_swap]["current_hp"] <= 0)
                {
                    rand_swap = Math.floor((Math.random() * 4) + 5);
                    num_cards++;
                    if(num_cards > 4){break;}
                }
            if(all_cards[rand_swap]["current_hp"] > 0)
            {
                action_list.push(new action (opp_card["game_id"], rand_swap, -1, parseInt(opp_card["spd"])));
            }
        }
        if(opp_card["card_id"] == 5)
        {
            var num_cards = 0;
            var rand_swap = Math.floor(Math.random() * 4);
                while(all_cards[rand_swap]["current_hp"] <= 0)
                {
                    rand_swap = Math.floor(Math.random() * 4);
                    num_cards++;
                    if(num_cards > 4){break;}
                }
            if(all_cards[rand_swap]["current_hp"] > 0)
            {
                action_list.push(new action(rand_swap, rand_swap, -2, parseInt(opp_card["spd"])));
                console.log(action_list[1]);
            }
        }
        if(opp_card["card_id"] == 16)
        {
            opp_card["atk"] = parseInt(opp_card["atk"]) + 1915;
            action_list.push(new action (opp_card["game_id"], parseInt(active_button.value), 1915, parseInt(opp_card["spd"])));
        }
    }
 }

function oppSendBuff(target)
{
    var user = parseInt(document.getElementById("opp-active-button").value);
    var user_card = all_cards[user];
    action_list.push(new action(user, target, -1, parseInt(user_card["spd"])));
}
 
function sendBuff()
{
    if(made_action != 0){action_list.pop();}
    var target = parseInt(document.getElementById("buff-target").value);
    console.log("Buffing " + target);
    if(all_cards[target]["current_hp"] <= 0)
    {
        current_action.innerHTML = `Cannot buff ${all_cards[target]["name"]} on account of their being dead.`;
    }
    else
    {
        var user = parseInt(document.getElementById("active-button").value);
        var user_card = all_cards[user];
        action_list.push(new action(user, target, -1, parseInt(user_card["spd"])));
        made_action += 1;
        current_action.innerHTML = `${user_card["name"]} will use ${user_card["atk_name"]} on ${all_cards[target]["name"]}`;
    }
}

function yuSwap()
{

    var target = parseInt(document.getElementById("swap-target").value);
    console.log("Swapping " + target);
    if(all_cards[target]["current_hp"] <= 0)
    {
        current_action.innerHTML = `Cannot swap in ${all_cards[target]["name"]} on account of their being dead.`;
    }
    else
    {
        var user = parseInt(document.getElementById("active-button").value);
        var user_card = all_cards[user];
        action_list.push(new action(target, target, -3, parseInt(user_card["spd"])));
        made_action += 1;
        current_action.innerHTML = `${user_card["name"]} will use ${user_card["atk_name"]} on ${all_cards[target]["name"]}`;
    }
}
 
function addAttack()
{
    if(made_action != 0){action_list.pop();}
    var active_button = document.getElementById("active-button");
    var active_card = all_cards[parseInt(active_button.value)];
    var get_target = document.getElementById("get-target");
    get_target.innerHTML = "";
    if(active_card["current_hp"] > 0)
    {
        
        var opp_button = document.getElementById("opp-active-button");
        var opp_card = all_cards[parseInt(opp_button.value)];
        
        if(active_card["atk"] != "-1")
        {
        
            var total_atk = parseInt(active_card["atk"]) + active_card["buffs"];
            
            var total_def = parseInt(opp_card["def"]) + opp_card["buffs"];
            
            var dmg_dealt = total_atk - total_def;
            if(dmg_dealt < 1){dmg_dealt = 1;}
        
            action_list.push(new action(parseInt(active_button.value), parseInt(opp_button.value), dmg_dealt, parseInt(active_card["spd"])));
            current_action.innerHTML = `${active_card["name"]} will use ${active_card["atk_name"]}`;
        }
        else
        {
            if(active_card["card_id"] == 7 || active_card["card_id"] == 9 || active_card["card_id"] == 13)
            {
                get_target.innerHTML += "TARGET: <select id='buff-target'>\n</select>\n<button id='send-buff'>CONFIRM</button>";
                var buff_select = document.getElementById("buff-target");
                for(let x = 0; x < 4; x++)
                {
                    buff_select.innerHTML += `<option value=${x}>${all_cards[parseInt(document.getElementById(`${x}-button`).value)]["name"]}</option>\n`
                }
                
                
                var buff_button = document.getElementById("send-buff");
                buff_button.addEventListener("click", sendBuff);
            }
            if(active_card["card_id"] == 5)
            {
                get_target.innerHTML += "TARGET: <select id='swap-target'>\n</select>\n<button id='send-swap'>CONFIRM</button>";
                var swap_select = document.getElementById("swap-target");
                for(let x = 5; x < 9; x++)
                {
                    swap_select.innerHTML += `<option value=${x}>${all_cards[parseInt(document.getElementById(`opp-${x}-button`).value)]["name"]}</option>\n`
                }
                
                var swap_button = document.getElementById("send-swap");
                swap_button.addEventListener("click", yuSwap);
            }
            if(active_card["card_id"] == 16)
            {
                active_card["atk"] = parseInt(active_card["atk"]) +  1915;
                action_list.push(new action(active_card["game_id"], parseInt(opp_button.value), 1915, parseInt(active_card["spd"])));
                current_action.innerHTML = `${active_card["name"]} will use ${active_card["atk_name"]}`;
            }
        }
        made_action = 1;
        console.log(`${active_card["name"]} will use ${active_card["atk_name"]}`);
        
    }
    else
    {
        current_action.innerHTML = `${active_card["name"]} has fainted. Please swap in another card.`
    }
 }

function multiAttack(card_id)
{
    const isOpp = (card_id > 4 && card_id < 10) || (card_id > 12);
    if(!isOpp)
    {
        for(let i = 5; i < 9; i++)
        {
            var this_button = document.getElementById(`opp-${i}-button`);
            var this_card = all_cards[parseInt(this_button.value)];
            if(this_card["current_hp"] > 0)
            {
                this_card["current_hp"] -= 1;
            }
        }
        var opp_active_button = document.getElementById("opp-active-button");
        var opp_active_card = all_cards[parseInt(opp_active_button.value)];
        if(opp_active_card["current_hp"] > 0)
        {
            opp_active_card["current_hp"] -= 1;
        }
    }
    else
    {
        for(let i = 0; i < 4; i++)
        {
            var this_button = document.getElementById(`${i}-button`);
            var this_card = all_cards[parseInt(this_button.value)];
            if(this_card["current_hp"] > 0)
            {
                this_card["current_hp"] -= 1;
            }
        }
        var active_button = document.getElementById("active-button");
        var active_card = all_cards[parseInt(active_button.value)];
        if(active_card["current_hp"] > 0)
        {
            active_card["current_hp"] -= 1;
        }
    }
}

function play_actions()
{
    if(action_list.length > 0)
    {
    console.log("-------NEW TURN-------");
    botRandomAction();
    action_list = action_list.sort(sort_by_spd);
    for(let i = 0; i < action_list.length; i++)
    {
        const this_action = action_list[i];
        const this_user = all_cards[this_action["user"]];
        if(this_user["current_hp"] > 0)
        {
            if(this_action.value == -2)
            {
                if(all_cards[this_action["user"]]["current_hp"] > 0)
                {
                    console.log(`${all_cards[this_action["target"]]["name"]} swaps in.`)
                    swap_in(document.getElementById(`${this_action["target"]}-button`));
                }
                setActive();
            }
            if(this_action.value > -1)
            {
                if(all_cards[this_action["user"]]["current_hp"] > 0)
                {
                    console.log(`${all_cards[this_action["user"]]["name"]} attacks.`)
                    if(this_action["user"] == 0 || this_action["user"] == 22) // Mykolyk & Jumash are the only ones w/ multiattacks
                    {
                        multiAttack(this_action["user"]);
                    }
                    else if(all_cards[this_action["user"]]["card_id"] == 16)
                    {
                        all_cards[this_action["user"]]["atk"] = all_cards[this_action["user"]]["atk"] + 1915;
                        attackCard(this_action["user"], this_action["target"]);
                        all_cards[this_action["user"]]["current_hp"] = 0;
                    }
                    else
                    {
                        attackCard(this_action["user"], this_action["target"]);
                    }
                    
                    
                }
            }
            if(this_action.value == -3)
            {
                if(all_cards[this_action["user"]]["current_hp"] > 0)
                {
                    console.log(`${all_cards[this_action["user"]]["name"]} swaps in.`)
                    testOppActive(this_action["user"]);
                }
            }
            if(this_action.value == -1)
            {  
                var target_card = all_cards[this_action["target"]];
                if(buffers_arr.includes(parseInt(this_user["card_id"])))
                {
                    if(this_user["card_id"] == 7)
                    {
                        target_card["current_hp"] += 2;
                        if(target_card["current_hp"] > target_card["max_hp"])
                        {
                            target_card["current_hp"] = target_card["max_hp"];
                        }
                    }
                    else
                    {
                        target_card["buffs"] += 1;
                    }
                }
            }
        } 
    }
    
    while(action_list.length != 0)
    {
        action_list.shift();
    }
    made_action = 0;
    current_action.innerHTML = "No Action Selected"
    updateStats();
    console.log("-------END TURN-------");
    }
}

function sort_by_spd(a, b)
{
    if(a["speed"] == b["speed"])
    {
      return 0;
    }
    else
      {
        return (a["speed"] > b["speed"]) ? -1 : 1;
      }}

function add_swap_id(button)
{
    const this_button = document.getElementById(`${button}-button`);
    const this_card = all_cards[parseInt(this_button.value)];
    var name = this_button.id;
    var button_val = parseInt(name.substring(0,1));
    action_list.push(new action(parseInt(this_card["game_id"]), button_val, -2, parseInt(this_card["spd"])));

}     
      
function add_swap(event)
{
    if(made_action != 0){action_list.pop();}
    var get_target = document.getElementById("get-target");
    get_target.innerHTML = "";
    const this_card = all_cards[parseInt(this.value)];
    if(this_card["current_hp"] > 0)
    {
        var name = this.id;
        var button_val = parseInt(name.substring(0,1));
        action_list.push(new action(parseInt(this_card["game_id"]), button_val, -2, parseInt(this_card["spd"])));
        made_action = 1;
        console.log(`${this_card["name"]} will swap in.`);
        current_action.innerHTML = `${this_card["name"]} will swap in.`;
    }
    else
    {
        current_action.innerHTML = `${this_card["name"]} has fainted.`
    }
}

function action(user, target, value, speed)
{
    this.user = user;
    this.target = target;
    this.value = value; // Attacks have value, special is -1, swap in is -2
    this.speed = speed;
}

function attackCard(attacker_id, defender_id)
{
    var attacker = all_cards[attacker_id];
    var defender = all_cards[defender_id];

    var damage_dealing = parseInt(attacker["atk"]) + parseInt(attacker["buffs"]);
    var defense = parseInt(defender["def"]) + parseInt(defender["buffs"]);
    var final_damage = damage_dealing - defense;
    if(final_damage < 1)
    {
        final_damage = 1;
    }
    
    if(final_damage > -1)
    {
        damageCard(defender_id, final_damage);
    }
    
    //  all_cards[defender_id]["current_hp"] = all_cards[defender_id]["current_hp"] - final_damage;
    
    if(all_cards[defender_id]["current_hp"] <= 0)
    {
        setHP(defender_id, 0);
        return -1;
    }
    updateStats();
}

}

function fillDeck(set)
{
    var cards = [];
    for(let i = 0; i < 5; i++)
    {
        var current = data[set[i]];
        cards.push(new Card(current["card_id"], current["max_hp"], current["atk"], current["def"], current["spd"], current["max_hp"], 0, 0, numCards, current["name"], current["atk_name"], current["atk_desc"] ));
        all_cards.push(cards[i]);
        numCards++;
    }
    
    return cards;
}

function Card(card_id, max_hp, atk, def, spd, current_hp, buffs, used_special, game_id, name, atk_name, atk_desc)
{
    this.card_id = card_id;
    this.max_hp = max_hp;
    this.atk = atk;
    this.def = def;
    this.spd = spd;
    this.current_hp = current_hp;
    this.buffs = buffs;
    this.used_special = used_special;
    this.game_id = game_id;
    this.name = name;
    this.atk_name = atk_name;
    this.atk_desc = atk_desc;
}


function shuffle (arr) {
  let i = 0,
      res = [],
      index

  while (i <= arr.length - 1) {
    index = Math.floor(Math.random() * arr.length)

    if (!res.includes(arr[index])) {
      res.push(arr[index])
      i++
    }
  }

  return res
}
