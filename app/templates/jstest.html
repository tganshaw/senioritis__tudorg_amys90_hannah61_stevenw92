<html>

<h1 id = "current-action">No Action Selected</h1>

<button id="send-actions">Send Actions</button>

<div id = "playfield">

<button id="active-button" value="-1">
<img id="active-card" width=245 height=337></img>
</button>

<button id ="opp-active-button" value="-1">
<img id="opp-active-card" width=245 height=337></img>
</button>

<br><br>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/4.1.2/papaparse.min.js"></script>
<script>

/*
    Order of events:
        - DEATH
        - Winning
        - Multi target attacks
        - Buffing allies
        - Yu
        - Stephan
        - Citron
        - Novillo
*/

const set_1 = "0;1;2;3;4".split(";");
const set_2 = "15;15;15;15;15".split(";");

const csv_str = "{{testingtesting}}";
var data = Papa.parse(csv_str,
{
    newline: "\n",
    header: true
});
data = data["data"];

var numCards = 0;

var all_cards = [];
var cards_1 = fillDeck(set_1);
var cards_2 = fillDeck(set_2);
var active_card = -1;

var action_list = [];
var send_actions = document.getElementById("send-actions");
send_actions.addEventListener("click", play_actions);

var your_cards_alive = 5;
var opp_cards_alive = 5;

var made_action = 0;
var current_action = document.getElementById("current-action");

setYourDeck(cards_1);
add_swap_id(4);
play_actions();
setTheirDeck(cards_2);
buttonTime(cards_1);
testOppActive(9);
setActive();
showStats();


function botRandomAction()
{
    var active_button = document.getElementById("opp-active-button");
    if(active_button)
    {
        var active_card = all_cards[parseInt(active_button.value)];
        
        if(active_card)
        {
            if(active_card["current_hp"] < active_card["max_hp"] / 2)
            {
                var num_cards = 0;    
                
                const rand_swap = Math.floor((Math.random() * 4) + 5);
                while(all_cards[rand_swap]["current_hp"] <= 0)
                {
                    rand_swap = Math.floor((Math.random() * 4) + 5);
                    num_cards++;
                    if(num_cards > 4){break;}
                }
                if(num_cards > 4)
                {
                    oppAddAttack();
                }
                action_list.push(new action(rand_swap, rand_swap, -3, all_cards[rand_swap]["spd"]));
            }
            else
            {
                oppAddAttack();
            }
        }
    }
}

function updateStats()
{
    your_cards_alive = 0;
    opp_cards_alive = 0;
    for(let i = 0; i < 4; i++)
    {
        var this_button = document.getElementById(`${i}-button`);
        var this_hp = document.getElementById(`${i}-hp`);
        if(this_hp)
        {
            if(all_cards[this_button.value]["current_hp"] > 0)
            {
                your_cards_alive++;
            }
            this_hp.innerHTML = `HP: ${all_cards[this_button.value]["current_hp"]}`;
        }
    }
    for(let i = 5; i < 9; i++)
    {
        var this_button = document.getElementById(`opp-${i}-button`);
        var this_hp = document.getElementById(`opp-${i}-hp`);
        if(this_hp)
        {
            // console.log(all_cards[this_button.value]);
            if(all_cards[this_button.value]["current_hp"] > 0)
            {
                opp_cards_alive++;
            }
            this_hp.innerHTML = `HP: ${all_cards[this_button.value]["current_hp"]}`;
        }
    }
    var active_button = document.getElementById("active-button");
    var active_hp = document.getElementById("active-hp");
    if(active_hp)
    {
        if(all_cards[active_button.value]["current_hp"] > 0)
        {
            your_cards_alive++;
        }

        active_hp.innerHTML = `HP: ${all_cards[active_button.value]["current_hp"]}`;
    }
    var opp_active_button = document.getElementById("opp-active-button");
    var opp_active_hp = document.getElementById("opp-active-hp");
    if(opp_active_hp)
    {
        if(all_cards[opp_active_button.value]["current_hp"] > 0)
        {
            opp_cards_alive++;
        }
        opp_active_hp.innerHTML = `HP: ${all_cards[opp_active_button.value]["current_hp"]}`;
    }
}

function showStats()
{
    for(let i = 0; i < 4; i++)
    {
        var this_button = document.getElementById(`${i}-button`);
        this_button.innerHTML += `<p id="${i}-hp">HP: ${all_cards[this_button.value]["current_hp"]}</p>`
    }
    for(let i = 5; i < 9; i++)
    {
        var this_button = document.getElementById(`opp-${i}-button`);
        this_button.innerHTML += `<p id="opp-${i}-hp">HP: ${all_cards[this_button.value]["current_hp"]}</p>`
    }
    var active_button = document.getElementById("active-button");
    active_button.innerHTML += `<p id="active-hp">HP: ${all_cards[active_button.value]["current_hp"]}</p>`
    var opp_active_button = document.getElementById("opp-active-button");
    opp_active_button.innerHTML += `<p id="opp-active-hp">HP: ${all_cards[opp_active_button.value]["current_hp"]}</p>`
}

function setActive()
{
    var active_button = document.getElementById("active-button");
    active_card = parseInt(active_button.value);
    active_button.addEventListener("click", addAttack);
}

function oppAddAttack()
{
    var active_button = document.getElementById("active-button");
    var active_card = all_cards[parseInt(active_button.value)];
    
    var opp_button = document.getElementById("opp-active-button");
    var opp_card = all_cards[parseInt(opp_button.value)];
    
    if(opp_card["atk"] != "-1")
    {
    
        var total_atk = parseInt(opp_card["atk"]) + opp_card["buffs"];
        
        var total_def = parseInt(active_card["def"]) + active_card["buffs"];
        
        var dmg_dealt = total_atk - total_def;
        if(dmg_dealt < 1){dmg_dealt = 1;}
    
        action_list.push(new action(parseInt(opp_button.value), parseInt(active_button.value), dmg_dealt, parseInt(opp_card["spd"])));
    }
 }

function addAttack()
{
    if(made_action != 0){action_list.pop();}
    var active_button = document.getElementById("active-button");
    var active_card = all_cards[parseInt(active_button.value)];
    if(active_card["current_hp"] > 0)
    {
        
        var opp_button = document.getElementById("opp-active-button");
        var opp_card = all_cards[parseInt(opp_button.value)];
        
        if(active_card["atk"] != "-1")
        {
        
            var total_atk = parseInt(active_card["atk"]) + active_card["buffs"];
            
            var total_def = parseInt(opp_card["def"]) + opp_card["buffs"];
            
            var dmg_dealt = total_atk - total_def;
            if(dmg_dealt < 1){dmg_dealt = 1;}
        
            action_list.push(new action(parseInt(active_button.value), parseInt(opp_button.value), dmg_dealt, parseInt(active_card["spd"])));
        }
        made_action = 1;
        console.log(`${active_card["name"]} will use ${active_card["atk_name"]}`);
        current_action.innerHTML = `${active_card["name"]} will use ${active_card["atk_name"]}`;
    }
    else
    {
        current_action.innerHTML = `${active_card["name"]} has fainted. Please swap in another card.`
    }
 }

function buttonTime(deck)
{
    for(let i = 0; i < 4; i++)
    {
        var button = document.getElementById(`${deck[i]["game_id"]}-button`);
        button.addEventListener("click", add_swap);
    }
}

function setYourDeck(deck)
{
    setActive();
   // deck = shuffle(deck);
    for(let i = 0; i < 5; i++)
    {
        var playfield = document.getElementById("playfield");
        playfield.innerHTML += `<button id="${deck[i]["game_id"]}-button" value="${deck[i]["game_id"]}">\n
        <img id = "${deck[i]["game_id"]}-card" src="../static/cards/${deck[i]["card_id"]}.png" width=245 height=337></img>\n
        </button>\n
        <br>\n`;
    }
    for(let i = 0; i < 5; i++)
    {
        var button = document.getElementById(`${deck[i]["game_id"]}-button`);
        button.addEventListener("click", add_swap);
    }
}

function setTheirDeck(deck)
{
    for(let i = 0; i < 5; i++)
    {
        var playfield = document.getElementById("playfield")
        playfield.innerHTML += `<button id="opp-${deck[i]["game_id"]}-button" value="${deck[i]["game_id"]}">\n
        <img id = "opp-${deck[i]["game_id"]}-card" src="../static/cards/${deck[i]["card_id"]}.png" width=245 height=337></img>\n
        </button>\n
        <br>\n`;
    }
}


function play_actions()
{
    if(action_list.length > 0)
    {
    console.log("-------NEW TURN-------");
    botRandomAction();
    action_list = action_list.sort(sort_by_spd);
    for(let i = 0; i < action_list.length; i++)
    {
        const this_action = action_list[i];
        const this_user = all_cards[this_action["user"]];
        if(this_user["current_hp"] > 0)
        {
            if(this_action.value == -2)
            {
                if(all_cards[this_action["user"]]["current_hp"] > 0)
                {
                    console.log(`${all_cards[this_action["target"]]["name"]} swaps in.`)
                    swap_in(document.getElementById(`${this_action["target"]}-button`));
                }
                setActive();
            }
            if(this_action.value > -1)
            {
                console.log(`${all_cards[this_action["user"]]["name"]} attacks.`)
                attackCard(this_action["user"], this_action["target"]);
            }
            if(this_action.value == -3)
            {
                if(all_cards[this_action["user"]]["current_hp"] > 0)
                {
                    console.log(`${all_cards[this_action["user"]]["name"]} swaps in.`)
                    testOppActive(this_action["user"]);
                }
            }
        } 
    }
    
    while(action_list.length != 0)
    {
        action_list.shift();
    }
    made_action = 0;
    updateStats();
    current_action.innerHTML = "No Action Selected"
    console.log("-------END TURN-------");
    }
}

function sort_by_spd(a, b)
{
    if(a["speed"] == b["speed"])
    {
      return 0;
    }
    else
      {
        return (a["speed"] > b["speed"]) ? -1 : 1;
      }}

function add_swap_id(button)
{
    const this_button = document.getElementById(`${button}-button`);
    const this_card = all_cards[parseInt(this_button.value)];
    var name = this_button.id;
    var button_val = parseInt(name.substring(0,1));
    action_list.push(new action(parseInt(this_card["game_id"]), button_val, -2, parseInt(this_card["spd"])));

}     
      
function add_swap(event)
{
    if(made_action != 0){action_list.pop();}
    const this_card = all_cards[parseInt(this.value)];
    if(this_card["current_hp"] > 0)
    {
        var name = this.id;
        var button_val = parseInt(name.substring(0,1));
        action_list.push(new action(parseInt(this_card["game_id"]), button_val, -2, parseInt(this_card["spd"])));
        made_action = 1;
        console.log(`${this_card["name"]} will swap in.`);
        current_action.innerHTML = `${this_card["name"]} will swap in.`;
    }
    else
    {
        current_action.innerHTML = `${this_card["name"]} has fainted.`
    }
}

function action(user, target, value, speed)
{
    this.user = user;
    this.target = target;
    this.value = value; // Attacks have value, special is -1, swap in is -2
    this.speed = speed;
}

function testOppActive(game_id)
{
    var active_value = document.getElementById("opp-active-button").value;
    const av1 = active_value;
    var active_button = document.getElementById("opp-active-button");
    
    
    var event = document.getElementById(`opp-${game_id}-button`)
    var swap_value = event.value;
    const sv1 = swap_value;
    var swap_button = event;
    
    const temp_value = av1;
    
    
    
    active_button.value = sv1;
    if(parseInt(av1) != -1)
    {
        swap_button.value = av1;
    }
    
    var active_source = document.getElementById("opp-active-card").src;
    const as1 = active_source;
    var active_img = document.getElementById("opp-active-card");
    
    var swap_source = document.getElementById(`opp-${sv1}-card`).src;
    const ss1 = swap_source;
    var swap_img = document.getElementById(`opp-${sv1}-card`);
    
    const temp_source = active_source;
    
    active_img.src = ss1;
    if(parseInt(av1) != -1)
    {
        swap_img.src = as1;
        swap_img.id = `opp-${av1}-card`;
    }
    
    if(parseInt(active_value) == -1)
    {
        event.remove();
    }
}

function swap_in(event)
{
   
    var active_value = document.getElementById("active-button").value;
    const av1 = active_value;
    var active_button = document.getElementById("active-button");
    
    var swap_value = event.value;
    const sv1 = swap_value;
    var swap_button = event;
    
    const temp_value = av1;
    
    
    
    active_button.value = sv1;
    if(parseInt(av1) != -1)
    {
        swap_button.value = av1;
    }
    
    var active_source = document.getElementById("active-card").src;
    const as1 = active_source;
    var active_img = document.getElementById("active-card");
    
    var swap_source = document.getElementById(`${sv1}-card`).src;
    const ss1 = swap_source;
    var swap_img = document.getElementById(`${sv1}-card`);
    
    const temp_source = active_source;
    
    active_img.src = ss1;
    if(parseInt(av1) != -1)
    {
        swap_img.src = as1;
        swap_img.id = `${av1}-card`;
    }
    
    if(parseInt(active_value) == -1)
    {
        event.remove();
    }
}

function attackCard(attacker_id, defender_id)
{
    var attacker = all_cards[attacker_id];
    var defender = all_cards[defender_id];

    var damage_dealing = parseInt(attacker["atk"]) + parseInt(attacker["buffs"]);
    var defense = parseInt(defender["def"]) + parseInt(defender["buffs"]);
    var final_damage = damage_dealing - defense;
    if(final_damage < 1)
    {
        final_damage = 1;
    }
    
    if(final_damage > -1)
    {
        damageCard(defender_id, final_damage);
    }
    
    //  all_cards[defender_id]["current_hp"] = all_cards[defender_id]["current_hp"] - final_damage;
    
    if(all_cards[defender_id]["current_hp"] <= 0)
    {
        setHP(defender_id, 0);
        return -1;
    }
    updateStats();
}

function setHP(card_id, amt)
{
    all_cards[card_id]["current_hp"] = amt;
}


function damageCard(card_id, damage)
{
    all_cards[card_id]["current_hp"] = all_cards[card_id]["current_hp"] - damage;
    var card_hp = parseInt(all_cards[card_id]["current_hp"]);
    
}

function fillDeck(set)
{
    var cards = [];
    for(let i = 0; i < set.length; i++)
    {
        var current = data[set[i]];
        cards.push(new Card(current["card_id"], current["max_hp"], current["atk"], current["def"], current["spd"], current["max_hp"], 0, 0, numCards, current["name"], current["atk_name"], current["atk_desc"] ));
        all_cards.push(cards[i]);
        numCards++;
    }
    
    return cards;
}

function Card(card_id, max_hp, atk, def, spd, current_hp, buffs, used_special, game_id, name, atk_name, atk_desc)
{
    this.card_id = card_id;
    this.max_hp = max_hp;
    this.atk = atk;
    this.def = def;
    this.spd = spd;
    this.current_hp = current_hp;
    this.buffs = buffs;
    this.used_special = used_special;
    this.game_id = game_id;
    this.name = name;
    this.atk_name = atk_name;
    this.atk_desc = atk_desc;
}


function shuffle (arr) {
  let i = 0,
      res = [],
      index

  while (i <= arr.length - 1) {
    index = Math.floor(Math.random() * arr.length)

    if (!res.includes(arr[index])) {
      res.push(arr[index])
      i++
    }
  }

  return res
}


</script>



</html>
