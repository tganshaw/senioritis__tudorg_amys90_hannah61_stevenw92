<html>
   <head>
      <title> Profile </title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
      <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
      <style>
         body{
         background-color: black;
         color: #FFFFFF;
         font-family: "Silkscreen", sans-serif;
         background-repeat: no-repeat;
         background-size: 100vw 100vh;
         }
         .hold{
         margin-top: 0vh;
         text-align: center;
         margin-left: 10vw;
         margin-right: 10vw;
         padding-top: 8vh;
         color: white;
         }
         h1{
         font-size: 600%
         }
         .a{
         color: black;
         font-family: "Silkscreen", sans-serif;
         }
         .b{
         padding-top: 0.5vh;
         padding-bottom: 0.5vh;
         padding-left: 1vw;
         padding-right: 1vw;
         background-color: white;
         border: none;
         border-radius: 6px;
         color: black;
         }
         .b:hover{
         background-color: #C7C7C7;
         color: black;
         }
         nav{
         padding-bottom: 2vh;
         padding-left: 2vw;
         padding-right: 2vw;
         }
         .c{
         color: #ffffff;
         padding-top: 1.5vh;
         padding-right: 2vw;
         border: none;
         font-size: 130%;
         background-color: rgba(0, 0, 0, 0);
         }
         .end{
         padding-left: 1.5vh;
         text-align: center;
         }
         .d{
         color: #ffffff;
         text-decoration: none;
         }
         .d:hover{
         color: #C7C7C7;
         }
         .progress{
         margin-left: 5vw;
         margin-right: 5vw;
         margin-top: 1vh;
         }
         .profile-select{
         margin-left: 5vw;
         }
         .modal-content{
         color:black;
         }
         .end{
         color:white;
         }
         .float-right-button{
           float:right;
           padding-bottom: 2vh;
           padding-top: 1vw;
           display: inline;
         }
      </style>
   </head>
   <body>
      <nav>
         <button class="c"> <a class="d" href="{{ url_for('encyclopedia') }}">Encyclopedia</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('profile') }}">Profile</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('homepage') }}">Game</a> </button>
         <button class="c"> <a class="d" href="{{ url_for('logout') }}">Logout</a> </button>
      </nav>
      <br>
      <br>
      <br>
      <div class= "text-center">
         <h2>User Information: {{user}}</h2>
         <img src= "{{ icon }}" class= "img-fluid" alt= "profilepic" style="width:150px; height:150px; object-fit:cover;">
      </div>
      <br>
      <br>
      <br>
      <details class = "profile-select">
         <summary class="button" style="font-size: 150%;">Change Profile Picture</summary>
         <br>
         <div class = "profile-icons">
            {% for icon in profile_icons %}
            <form action = "/profile" method = "POST" style="display: inline;">
               <input type = "hidden" name = "profile_icon" value = "{{ icon }}">
               <button type = "submit" class = "icon-button">
               <img src = "{{ icon }}" class = "profile-icon" alt = "Profile Icon {{ loop.index }}" style="width:150px; height:150px; object-fit:cover;">
               </button>
            </form>
            {% endfor %}
         </div>
      </details>
   </body>
</html>
