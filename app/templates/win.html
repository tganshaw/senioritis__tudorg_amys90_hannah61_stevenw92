<script>

// Source - https://stackoverflow.com/a/1484514
// Posted by Anatoliy, modified by community. See post 'Timeline' for change history
// Retrieved 2026-05-21, License - CC BY-SA 3.0

function getRandomColor() {
  var letters = '0123456789ABCDEF';
  var color = '#';
  for (var i = 0; i < 6; i++) {
    color += letters[Math.floor(Math.random() * 16)];
  }
  return color;
}

function changeColor()
{
  var style_tag = document.getElementById("style");
  style_tag.innerHTML += `p\{color:${getRandomColor()}\}\n.navbar\{background-color:${getRandomColor()}\}`;
}
