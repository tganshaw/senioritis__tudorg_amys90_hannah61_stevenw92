<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encyclopedia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anta&display=swap" rel="stylesheet">
  <style>
  body{
    padding:0px;
    background-color:#900020;
    color:white;
    font-family: "Anta";
  }
  </style>
</head>

<body>
  <nav class="bg-gray-800 border-b fixed top-0 right-0 left-0 w-full z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-evenly">

    <ul class="flex space-x-4 text-blue-700">
        <a href="/encyclopedia" class=" hover:text-red-600">
          Encyclopedia
        </a>
    </ul>

    <ul class="flex space-x-4">
        <a href="/game" class=" hover:text-red-600">
          Game
        </a>
    </ul>

    <ul class="flex space-x-4">
        <a href="/" class=" hover:text-red-600">
          Profile
        </a>
    </ul>
<ul class="flex space-x-4">
  <form action="{{url_for('logout')}}" method="POST">
    <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 border border-blue-700 rounded">Logout</button>
  </form>
</ul>
</div>
</nav>

<div class="p-8">
  <div class="p-8">
    <br>
    <br>
    <br>
    <h1 class="text-4xl font-bold mb-8 text-center">Encyclopedia</h1>
  </div>

<br>
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    <script>
      var data = "{{data}}";
      console.log(data)
      data = data.split("\n");
      for (let i = 0; i<data.length;i++){
        data[i]=data[i].split(",");
}
      data.pop();

      for (let i = 1; i < data.length; i++) {
        document.write(`
          <div class="block max-w-sm border border-gray-200 rounded-xl shadow-sm overflow-hidden">
              <a href="/card/${data[i][0]}">
                  <img class="w-full aspect-63/88 object-cover" src="../static/cards/${data[i][0]}.png" alt="${data[i][1]}" />
              </a>


          </div>
        `);
      }
    </script>

  </div>
</body>
</html>
